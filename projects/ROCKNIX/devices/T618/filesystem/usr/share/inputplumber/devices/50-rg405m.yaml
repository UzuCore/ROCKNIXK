# yaml-language-server: $schema=https://raw.githubusercontent.com/ShadowBlip/InputPlumber/main/rootfs/usr/share/inputplumber/schema/composite_device_v1.json
# Anbernic RG405M. Layout follows ROCKNIX RK3576 01-rg-vita-pro.yaml (ds5 + keyboard targets,
# the DualSense entry already exists in EmulationStation's es_input.cfg).
version: 1
kind: CompositeDevice
name: Anbernic RG405M
matches:
  - udev:
      sys_path: /sys/firmware/devicetree/base
      attributes:
        - name: model
          value: Anbernic RG405M
maximum_sources: 3
source_devices:
  - group: gamepad
    evdev:
      name: RG405M Buttons
      handler: event*
    capability_map_id: rg405m_keys
  - group: gamepad
    evdev:
      name: RG405M Analog
      handler: event*
    capability_map_id: rg405m_keys
  - group: gamepad
    evdev:
      name: sc27xx:vibrator
      handler: event*
options:
  auto_manage: true
target_devices:
  - ds5
  - keyboard

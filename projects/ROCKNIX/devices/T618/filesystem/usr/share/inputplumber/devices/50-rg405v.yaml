version: 1
kind: CompositeDevice
name: Anbernic RG405V
matches:
  - udev:
      sys_path: /sys/firmware/devicetree/base
      attributes:
        - name: model
          value: Anbernic RG405V
maximum_sources: 3
source_devices:
- group: gamepad
  evdev:
    name: RG405V Buttons
    handler: event*
  capability_map_id: rg405v_keys
- group: gamepad
  evdev:
    name: RG405V Analog
    handler: event*
  capability_map_id: rg405v_keys
- group: gamepad
  evdev:
    name: sc27xx:vibrator
    handler: event*
options:
  auto_manage: true
target_devices:
- ds5
- keyboard

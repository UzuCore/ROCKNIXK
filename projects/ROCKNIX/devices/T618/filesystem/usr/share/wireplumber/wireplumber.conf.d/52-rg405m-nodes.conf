# RG405M VBC runs 24-bit; the planar (MMAP_NONINTERLEAVED) layout PipeWire otherwise picks stalls the DMA.
monitor.alsa.rules = [
  {
    matches = [ { node.name = "~alsa_(output|input)._sys_devices_platform_sound_0_sound_card0.*" } ]
    actions = { update-props = { audio.format = "S24_32LE", audio.rate = 48000, audio.allowed-rates = [ 48000 ] } }
  }
  {
    # The VBC DMA position only advances in coarse steps (up to ~1000 frames), so PipeWire's timer
    # scheduling (tsched) mis-estimates the fill level and underruns hundreds of times per second on
    # a 256-frame quantum: crackling audio and, with audio_sync, stuttering games (600 frames took
    # 15.4 s instead of 10). Drive the graph from the period interrupt instead.
    # Measured: 0 xruns in snes9x / mupen64plus / ppsspp / dolphin, 600 frames in 10.85 s, ~9 ms delay.
    matches = [ { node.name = "~alsa_output._sys_devices_platform_sound_0_sound_card0.*" } ]
    actions = {
      update-props = {
        api.alsa.disable-tsched = true
        api.alsa.period-size = 512
        api.alsa.period-num = 4
      }
    }
  }
]

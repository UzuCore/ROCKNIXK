# RG405M VBC runs 24-bit; the planar (MMAP_NONINTERLEAVED) layout PipeWire otherwise picks stalls the DMA.
#
# Scheduling is left at PipeWire's default (timer based). Before the sprd-dma stride fix
# (devices/T618/patches/linux/0130-*) the DMA position jumped in ~1000-frame steps and timer
# scheduling underran constantly; a period-interrupt workaround used to live here. With the fix
# the position advances in 80/160-frame steps, timer scheduling runs 60.00 fps in snes9x with
# ~1 xrun per 100 s, and the interrupt mode could fall into a stop/start loop (games froze).
monitor.alsa.rules = [
  {
    matches = [ { node.name = "~alsa_(output|input)._sys_devices_platform_sound_0_sound_card0.*" } ]
    actions = { update-props = { audio.format = "S24_32LE", audio.rate = 48000, audio.allowed-rates = [ 48000 ] } }
  }
]

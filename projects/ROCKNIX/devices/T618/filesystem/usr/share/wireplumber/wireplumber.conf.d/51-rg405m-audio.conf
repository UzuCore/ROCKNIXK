# RG405M (Unisoc SC2730 + VBC v4 DSP): UCM profiles only. Pro-audio probing opens every vendor DSP scene PCM
# and an unanswered scene (LOOP) takes the audio DSP offline for the rest of the boot.
monitor.alsa.rules = [
  {
    matches = [ { api.alsa.card.name = "RG405M" } ]
    actions = {
      update-props = {
        api.alsa.use-ucm = true
        api.acp.disable-pro-audio = true
      }
    }
  }
]

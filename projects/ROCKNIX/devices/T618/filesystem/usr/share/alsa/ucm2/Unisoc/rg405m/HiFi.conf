Syntax 4

SectionVerb {
	Value { TQ "HiFi" }
	EnableSequence [
		cset "name='Audio Structure Profile Update' 1"
		cset "name='DSP VBC Profile Update' 1"
	]
}

SectionDevice."Speaker" {
	Comment "RG405M Speaker"
	ConflictingDevice [ "Headphones" ]
	EnableSequence [
		cset "name='DSP VBC Profile Select' 961216512"
		cset "name='ag_iis0_ext_sel' enable"
		cset "name='S_NORMAL_AP01_P_CODEC SWITCH' 1"
		cset "name='S_NORMAL_AP23_P_CODEC SWITCH' 1"
		cset "name='S_FAST_P_CODEC SWITCH' 1"
		cset "name='S_OFFLOAD_CODEC SWITCH' 1"
		cset "name='S_VOICE_P_CODEC SWITCH' 1"
		cset "name='S_VOIP_P_CODEC SWITCH' 1"
		cset "name='S_FM_CODEC SWITCH' 1"
		cset "name='S_LOOP_P_CODEC SWITCH' 1"
		cset "name='S_FM_DSP_CODEC SWITCH' 1"
		cset "name='S_VOICE_PCM_P SWITCH' 1"
		cset "name='VBC_IIS_TX0_WD_SEL' WD_24BIT"
		cset "name='VBC_IIS_TX1_WD_SEL' WD_24BIT"
		cset "name='VBC_MUX_DAC0_IIS_PORT_SEL' VBC_IIS_PORT_IIS0"
		cset "name='VBC_MUX_DAC1_IIS_PORT_SEL' VBC_IIS_PORT_IIS0"
		cset "name='VBC_MUX_IIS0_PORT_DO_SEL' IIS_DO_VAL_DAC0"
		cset "name='VBC_MUX_IIS2_PORT_DO_SEL' IIS_DO_VAL_DAC2"
		cset "name='VBC_MUX_IIS3_PORT_DO_SEL' IIS_DO_VAL_DAC2"
		cset "name='HP mix mode' 0"
		cset "name='DAC LRCLK Select' invert"
		cset "name='HPL EAR Sel' HPL"
		cset "name='HPL Mixer DACLHPL Switch' 1"
		cset "name='HPR Mixer DACRHPR Switch' 1"
		cset "name='Speaker Function' 1"
		cset "name='Speaker1 Function' 1"
	]
	DisableSequence [
		cset "name='DAC LRCLK Select' normal"
		cset "name='Speaker Function' 0"
		cset "name='Speaker1 Function' 0"
		cset "name='HPL Mixer DACLHPL Switch' 0"
		cset "name='HPR Mixer DACRHPR Switch' 0"
		cset "name='HPL EAR Sel' EAR"
		cset "name='HP mix mode' 1"
		cset "name='S_NORMAL_AP01_P_CODEC SWITCH' 0"
		cset "name='S_NORMAL_AP23_P_CODEC SWITCH' 0"
		cset "name='S_FAST_P_CODEC SWITCH' 0"
		cset "name='S_OFFLOAD_CODEC SWITCH' 0"
		cset "name='S_VOICE_P_CODEC SWITCH' 0"
		cset "name='S_VOIP_P_CODEC SWITCH' 0"
		cset "name='S_FM_CODEC SWITCH' 0"
		cset "name='S_LOOP_P_CODEC SWITCH' 0"
		cset "name='S_FM_DSP_CODEC SWITCH' 0"
		cset "name='S_VOICE_PCM_P SWITCH' 0"
	]
	Value {
		PlaybackPriority 200
		PlaybackPCM "hw:${CardId},0"
		PlaybackChannels 2
		PlaybackRate 48000
	}
}

SectionDevice."Headphones" {
	Comment "RG405M Headphones"
	ConflictingDevice [ "Speaker" ]
	EnableSequence [
		cset "name='DSP VBC Profile Select' 944111616"
		cset "name='ag_iis0_ext_sel' enable"
		cset "name='S_NORMAL_AP01_P_CODEC SWITCH' 1"
		cset "name='S_NORMAL_AP23_P_CODEC SWITCH' 1"
		cset "name='S_FAST_P_CODEC SWITCH' 1"
		cset "name='S_OFFLOAD_CODEC SWITCH' 1"
		cset "name='S_VOICE_P_CODEC SWITCH' 1"
		cset "name='S_VOIP_P_CODEC SWITCH' 1"
		cset "name='S_FM_CODEC SWITCH' 1"
		cset "name='S_LOOP_P_CODEC SWITCH' 1"
		cset "name='S_FM_DSP_CODEC SWITCH' 1"
		cset "name='S_VOICE_PCM_P SWITCH' 1"
		cset "name='VBC_IIS_TX0_WD_SEL' WD_24BIT"
		cset "name='VBC_IIS_TX1_WD_SEL' WD_24BIT"
		cset "name='VBC_MUX_DAC0_IIS_PORT_SEL' VBC_IIS_PORT_IIS0"
		cset "name='VBC_MUX_DAC1_IIS_PORT_SEL' VBC_IIS_PORT_IIS0"
		cset "name='VBC_MUX_IIS0_PORT_DO_SEL' IIS_DO_VAL_DAC0"
		cset "name='VBC_MUX_IIS2_PORT_DO_SEL' IIS_DO_VAL_DAC2"
		cset "name='VBC_MUX_IIS3_PORT_DO_SEL' IIS_DO_VAL_DAC2"
		cset "name='HP mix mode' 0"
		cset "name='DAC LRCLK Select' invert"
		cset "name='HPL EAR Sel' HPL"
		cset "name='HPL Mixer DACLHPL Switch' 1"
		cset "name='HPR Mixer DACRHPR Switch' 1"
		cset "name='HeadPhone Function' 1"
		cset "name='HP_CROSSTALK_EN' 1"
		cset "name='HP_CROSSTALK_GAIN' 14800,14800"
	]
	DisableSequence [
		cset "name='DAC LRCLK Select' normal"
		cset "name='HeadPhone Function' 0"
		cset "name='HPL Mixer DACLHPL Switch' 0"
		cset "name='HPR Mixer DACRHPR Switch' 0"
		cset "name='HPL EAR Sel' EAR"
		cset "name='HP mix mode' 1"
		cset "name='HP_CROSSTALK_EN' 0"
		cset "name='HP_CROSSTALK_GAIN' 0,0"
		cset "name='S_NORMAL_AP01_P_CODEC SWITCH' 0"
		cset "name='S_NORMAL_AP23_P_CODEC SWITCH' 0"
		cset "name='S_FAST_P_CODEC SWITCH' 0"
		cset "name='S_OFFLOAD_CODEC SWITCH' 0"
		cset "name='S_VOICE_P_CODEC SWITCH' 0"
		cset "name='S_VOIP_P_CODEC SWITCH' 0"
		cset "name='S_FM_CODEC SWITCH' 0"
		cset "name='S_LOOP_P_CODEC SWITCH' 0"
		cset "name='S_FM_DSP_CODEC SWITCH' 0"
		cset "name='S_VOICE_PCM_P SWITCH' 0"
	]
	Value {
		JackControl "Headset Jack"
		JackHWMute "Speaker"
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},0"
		PlaybackChannels 2
		PlaybackRate 48000
	}
}
